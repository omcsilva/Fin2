<div class="pagination"><span>{{ page.paginator.count }} resultados · Página {{ page.number }} de {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a href="?{{ query_string }}&amp;page={{ page.previous_page_number }}">← Anterior</a>{% endif %}{% if page.has_next %}<a href="?{{ query_string }}&amp;page={{ page.next_page_number }}">Próxima →</a>{% endif %}</div></div>
