<div class="record-heading">
<div><a class="back" href="{{ detail_header.catalog_url }}">← {{ detail_header.catalog_label }}</a><h1>{{ detail_header.title }}</h1></div>
</div>
{% if detail_header.parents %}<nav class="record-parents" aria-label="Registros relacionados">{% for parent in detail_header.parents %}<span><strong>{{ parent.label }}:</strong> <a href="{{ parent.url }}">{{ parent.name }}</a></span>{% endfor %}</nav>{% endif %}
