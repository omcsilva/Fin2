<li class="import-step{% if current_step == number %} is-current{% endif %}"{% if current_step == number %} aria-current="step"{% endif %}>
{% if url %}<a href="{{ url }}" class="import-step-link" title="{{ description }}">{% else %}<span class="import-step-link" title="{{ description }}">{% endif %}
<span class="import-step-number" aria-hidden="true">{{ number }}</span>
<span class="import-step-text"><strong>{{ label }}</strong></span>
{% if url %}</a>{% else %}</span>{% endif %}
</li>
