# Add inside the existing t1django server block.
location /fin1/static/ { alias /opt/fin1/STATIC/; }
location /fin1/anexos/ { alias /var/lib/fin1/ANEXOS/; }
location /fin1/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $fin2_forwarded_scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 130s;
}
