# Example for a proxy INSIDE the LXC. Replace host and allowed network.
# For HTTPS, install this location configuration in your TLS server block.
server {
    listen 80;
    server_name fin2.example.internal;
    allow 127.0.0.1;
    allow 192.168.1.0/24;
    deny all;
    client_max_body_size 12m;
    location /fin2/static/ {
        alias /opt/fin2/staticfiles/;
    }
    location /fin2/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
    }
    location / { return 404; }
}
