# Proposed server in nginx-ui on rpi3. Keep existing sites and Cloudflare Access.
# Validate origin ingress restrictions before enabling this server.
server {
    listen 80;
    server_name django.lmnet.qzz.io;
    client_max_body_size 12m;
    location /fin2/ {
        proxy_pass http://10.0.0.17;
        proxy_set_header Host django.lmnet.qzz.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
    }
    # Other applications require their own reviewed routes.
    location / { return 404; }
}
