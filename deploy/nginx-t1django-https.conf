# Replacement Fin2 site. map belongs in the nginx http context.
# Trust the HTTPS forwarding flag only from the identified rpi3 proxy.
map "$remote_addr:$http_x_forwarded_proto" $fin2_forwarded_scheme {
    default $scheme;
    "10.0.0.3:https" https;
}
server {
    listen 80;
    server_name django.lmnet.qzz.io t1django.lan 10.0.0.17;
    allow 127.0.0.1;
    allow 10.0.0.0/24;
    deny all;
    client_max_body_size 12m;
    location /fin2/static/ { alias /opt/fin2/staticfiles/; }
    location /fin2/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fin2_forwarded_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
    }
    location /fin1/static/ { alias /opt/fin1/STATIC/; }
    location /fin1/anexos/ { alias /var/lib/fin1/ANEXOS/; }
    location /fin1/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fin2_forwarded_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
    }
    location / { return 404; }
}
